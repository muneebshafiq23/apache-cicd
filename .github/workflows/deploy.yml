name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: game-website

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/game-website:latest .

    - name: Push Docker Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/game-website:latest

  deploy:

    needs: build

    runs-on: ubuntu-latest

    steps:

    - name: Deploy on EC2
      uses: appleboy/ssh-action@v1.2.0

      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}

        script: |

          docker pull ${{ secrets.DOCKER_USERNAME }}/game-website:latest

          docker stop game || true

          docker rm game || true

          docker run -d \
            --name game \
            -p 80:80 \
            --restart unless-stopped \
            ${{ secrets.DOCKER_USERNAME }}/game-website:latest